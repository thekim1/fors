# Optional read-only Data API (docs/data-access.md). Needs the fors-dataapi-secrets and fors-dataapi-certs secrets
# (create-secrets.sh) and the fors_data database role (deploy/postgres/init.sql or add-data-role.sql).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# Its settings (fors-dataapi-config) are generated in the base, so an overlay can merge DataApi__Authority into them.
resources:
  - dataapi.yaml
