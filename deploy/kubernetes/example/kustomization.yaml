# Example overlay: copy this directory, change the values marked "change", then
#   ./deploy/kubernetes/deploy.sh path/to/your-overlay
# See docs/kubernetes.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fors-gateway
resources:
  - namespace.yaml
  - ../base
  - ingress.yaml
  # - ingress-dataapi.yaml   # with ../components/dataapi
components:
  # In-cluster Postgres and Redis. Remove this line to use your own (then edit the connection strings before running
  # create-secrets.sh; see docs/kubernetes.md).
  - ../components/datastores
  # - ../components/dataapi
  # NetworkPolicies for the flows in docs/network-and-ports.md; check the lines marked "change" in it first.
  # - ../components/networkpolicies
images:
  # The released images. A release bundle already pins the base to them by digest, so these lines only matter when you
  # deploy from the repository, or set newName to your own registry (pin by digest: digest: sha256:...).
  - {name: fors/gateway, newName: ghcr.io/thekim1/fors/gateway, newTag: "latest"}
  - {name: fors/adminapi, newName: ghcr.io/thekim1/fors/adminapi, newTag: "latest"}
  - {name: fors/migrations, newName: ghcr.io/thekim1/fors/migrations, newTag: "latest"}
  - {name: fors/dataapi, newName: ghcr.io/thekim1/fors/dataapi, newTag: "latest"}
configMapGenerator:
  - name: fors-adminapi-config
    behavior: merge
    literals:
      # change: the gateway's public address.
      - Gateway__BaseUrl=https://llm.example.se
      # Sign-in (docs/kubernetes.md, "Sign-in"), one of two ways:
      # - the setup wizard: leave Oidc__Authority commented out. After the first deploy.sh, read the setup code with
      #   kubectl -n fors-gateway logs deploy/adminapi | grep 'Setup code' and open https://<admin host>/setup; it shows the
      #   redirect URIs, takes the provider, client and secret and tests a sign-in before saving;
      # - declared: Oidc__Authority set (your identity provider, docs/identity-and-roles.md) keeps the wizard closed for
      #   good. Every Oidc__ literal set is the deployment's value, locked in the wizard; a client secret goes in
      #   fors-adminapi-secrets (init-deployment.sh --oidc-client-secret-file, which needs --oidc-authority).
      # - Oidc__Authority=https://idp.example.se/realms/fors
      # - Oidc__ClientId=fors-admin
      # - Oidc__RoleClaim=roles
      # Groups that grant a role are always deployment values.
      # - Oidc__RoleGroups__gateway-admin=GG-Llm-Admins
      # Any new value (for example today's date) opens the setup wizard again, once, for an hour; the new setup code is
      # in kubectl logs deploy/adminapi. Empty it before restoring a database.
      # - Setup__Reopen=2026-11-16
      # - DataApi__PublicUrl=https://llm-data.example.se
      # - Admin__IntegrationRequestsPerMinute=60
  - name: fors-gateway-config
    behavior: merge
    literals: []
      # - OTEL_EXPORTER_OTLP_ENDPOINT=https://otel-collector.observability:4317
      # - Gateway__AdminUrl=https://llm-admin.example.se
      # - Gateway__IntegrationApiUrl=https://adminapi:8443/integration/v1
      # The admin console's provider for /v1/fors/context; unset hands out the one saved in the setup wizard. Set it
      # whenever fors-adminapi-config declares Oidc__Authority, to the same address.
      # - Gateway__OidcAuthority=https://idp.example.se/realms/fors
  # With ../components/dataapi:
  # - name: fors-dataapi-config
  #   behavior: merge
  #   literals:
  #     # The issuer of the integrations' access tokens; never the setup wizard's. Unset, only Data API keys work.
  #     - DataApi__Authority=https://idp.example.se/realms/fors
patches:
  # More gateway replicas for more traffic (each replica handles thousands of requests per second; docs/performance.md).
  - target: {kind: Deployment, name: gateway}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
