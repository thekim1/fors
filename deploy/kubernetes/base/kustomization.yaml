# Fors on Kubernetes: gateway, admin API and the migrations Job. Postgres and Redis come from your platform
# or from components/datastores; the optional Data API from components/dataapi. Do not edit this base: make an overlay
# (start from ../example) and see docs/kubernetes.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs: {app.kubernetes.io/part-of: fors}
resources:
  - migrations.yaml
  - gateway.yaml
  - adminapi.yaml
configMapGenerator:
  # app-roles.sql is a copy of deploy/postgres/app-roles.sql (deploy/kubernetes/sync-config.sh; CI checks it).
  - name: fors-app-roles
    files: [app-roles.sql]
  # Settings as the apps read them (section__key). The overlay merges its own values in; see ../example.
  - name: fors-gateway-config
    literals:
      - Gateway__Security__SourceAddress=Truncated
  - name: fors-adminapi-config
    literals:
      # No Oidc__* here: sign-in is set in the setup wizard unless the overlay declares it, and every Oidc__* an overlay
      # sets is the deployment's value, locked in the wizard (docs/kubernetes.md, "Sign-in"; ../example shows both ways).
      - Gateway__OperationsUrl=https://gateway:8443
      # Empty. A new value opens the setup wizard once more; the setup code's key is the file Setup__Secret in
      # fors-adminapi-secrets (create-secrets.sh).
      - Setup__Reopen=
  # Used only with ../components/dataapi; generated here because an overlay merges its values before components apply.
  - name: fors-dataapi-config
    literals:
      - DataApi__Audience=fors-data-api
      - DataApi__MinimumGroupSize=5
      - DataApi__TimeZone=Europe/Stockholm
