name: Verify
# Runs on what can still change the outcome, once per change (docs/local-development.md, "CI and Actions minutes"):
# - a pull request is verified on its merge with main, but not while it is a draft;
# - a release tag is verified again before anything is published (release.yml calls this workflow);
# - pushes to main are not built: a pull request was verified on the merge with main, and the next tag verifies main.
# Documentation-only changes are not built (the website workflow builds docs/). A branch without a pull request, or main,
# can be verified from the Actions tab (workflow_dispatch).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'site/**'
      - 'benchmarks/compare/**'
      - 'Design prototype/**'
      - '.claude/**'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
# A newer push to a pull request cancels the run in progress. Release tags have their own group (github.ref is the tag), so a
# release is never cancelled by a push.
concurrency:
  group: verify-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Portainer stack is up to date
        run: |
          sh deploy/build-portainer-stack.sh
          git diff --exit-code -- deploy/compose.portainer.yaml || { echo "Run deploy/build-portainer-stack.sh and commit compose.portainer.yaml"; exit 1; }
      - name: Release bundle builds and holds the guides it names
        run: |
          # The same script as release.yml, with placeholder images: it fails when a bundled file names a docs/ guide
          # the bundle does not contain (#113).
          digest="sha256:$(printf '0%.0s' $(seq 64))"
          GATEWAY_IMAGE="ghcr.io/thekim1/fors/gateway:0.0.0@$digest" ADMINAPI_IMAGE="ghcr.io/thekim1/fors/adminapi:0.0.0@$digest" \
            MIGRATIONS_IMAGE="ghcr.io/thekim1/fors/migrations:0.0.0@$digest" DATAAPI_IMAGE="ghcr.io/thekim1/fors/dataapi:0.0.0@$digest" \
            sh deploy/build-release-bundle.sh 0.0.0 "$RUNNER_TEMP/bundle"
          tar -tzf "$RUNNER_TEMP/bundle/fors-0.0.0.tar.gz" | grep -qx 'fors-0.0.0/docs/runbook.md'
      - name: Local image defaults are untagged dev images
        run: |
          # ${X_IMAGE:-fors/<service>:latest} is the locally built image; a release bundle pins the pushed one
          # (release.yml derives the real version from the pushed git tag, not from a committed version).
          stale="$(grep -Hn 'fors/[a-z]*:' deploy/compose.prod.yaml deploy/compose.portainer.template.yaml deploy/compose.portainer.yaml | grep -v ':latest}' || true)"
          stale="$stale$(grep -rHn 'image: fors/' deploy/kubernetes | grep -v ':latest$' || true)"
          stale="$stale$(grep -Hn 'newTag:' deploy/kubernetes/example/kustomization.yaml | grep -v 'newTag: \"latest\"' || true)"
          [ -z "$stale" ] || { echo "Local image defaults must stay pinned to :latest:"; echo "$stale"; exit 1; }
      - name: Kubernetes manifests are up to date and render
        run: |
          sh deploy/kubernetes/sync-config.sh
          git diff --exit-code -- deploy/kubernetes || { echo "Run deploy/kubernetes/sync-config.sh and commit the copies"; exit 1; }
          kubectl kustomize deploy/kubernetes/base > /dev/null
          kubectl kustomize deploy/kubernetes/example > /dev/null
          # The optional parts too: an overlay with the Data API, its Ingress and the NetworkPolicies enabled.
          cp -R deploy/kubernetes "$RUNNER_TEMP/k8s"
          sed -i -e 's|# - \.\./components/dataapi|- ../components/dataapi|' \
            -e 's|# - \.\./components/networkpolicies|- ../components/networkpolicies|' \
            -e 's|# - ingress-dataapi.yaml.*|- ingress-dataapi.yaml|' "$RUNNER_TEMP/k8s/example/kustomization.yaml"
          kubectl kustomize "$RUNNER_TEMP/k8s/example" | grep -c 'kind: NetworkPolicy'
      - name: Production Compose files are valid
        env:
          FORS_CERTS_DIR: /certs
          FORS_SECRETS_DIR: /secrets
          FORS_OIDC_AUTHORITY: https://idp.example.se
          FORS_GATEWAY_HOST: llm.example.se
          FORS_GATEWAY_PUBLIC_URL: https://llm.example.se
          GATEWAY_IMAGE: gateway
          ADMINAPI_IMAGE: adminapi
          MIGRATIONS_IMAGE: migrations
        run: |
          for file in deploy/compose.prod.yaml deploy/compose.portainer.yaml; do
            docker compose -f "$file" --profile data config --quiet
          done
          docker compose -f deploy/compose.prod.yaml -f deploy/compose.rolling.yaml --profile data config --quiet
          # FORS_DOMAIN alone names the hosts of the Portainer stack (#98): no FORS_GATEWAY_HOST or FORS_GATEWAY_PUBLIC_URL.
          env -u FORS_GATEWAY_HOST -u FORS_GATEWAY_PUBLIC_URL FORS_DOMAIN=example.se \
            docker compose -f deploy/compose.portainer.yaml config > "$RUNNER_TEMP/portainer-domain.yaml"
          grep -q 'Gateway__BaseUrl: https://llm.example.se$' "$RUNNER_TEMP/portainer-domain.yaml"
          grep -q 'FORS_ADMIN_HOST: llm-admin.example.se$' "$RUNNER_TEMP/portainer-domain.yaml"
          # Setup mode (#100). The variables above are the previous release's (authority, gateway host, public URL; no
          # FORS_DOMAIN, no setup variables): the admin API is declared, Setup__Reopen is empty, and the client id and claim
          # names are not passed as values that would lock the wizard (empty is unset; the code's defaults apply).
          for files in deploy/compose.prod.yaml "deploy/compose.prod.yaml deploy/compose.rolling.yaml" deploy/compose.portainer.yaml; do
            # shellcheck disable=SC2046
            docker compose $(printf -- '-f %s ' $files) --profile data config --format json | jq -e '.services.adminapi.environment
              | .Oidc__Authority == "https://idp.example.se" and .Setup__Reopen == ""
                and ([to_entries[] | select((.key | test("^Oidc__(ClientId|RoleClaim|DepartmentClaim|TeamClaim|GroupClaim|ExtraScopes__0)$"))
                       and .value != "")] | length == 0)' >/dev/null
          done
          # A new deployment for the setup wizard: every file renders without FORS_OIDC_AUTHORITY, and nothing declares sign-in.
          for files in deploy/compose.prod.yaml "deploy/compose.prod.yaml deploy/compose.rolling.yaml" deploy/compose.portainer.yaml; do
            # shellcheck disable=SC2046
            env -u FORS_OIDC_AUTHORITY docker compose $(printf -- '-f %s ' $files) --profile data config --format json | jq -e '[.services[]
              | .environment // {} | to_entries[] | select((.key | test("^Oidc__|^DataApi__Authority$|^Gateway__OidcAuthority$")) and .value != "")]
              | length == 0' >/dev/null
          done
          # The Portainer stack with only the domain and the images (the release asset pins the images).
          env -u FORS_OIDC_AUTHORITY -u FORS_GATEWAY_HOST -u FORS_GATEWAY_PUBLIC_URL FORS_DOMAIN=example.se \
            docker compose -f deploy/compose.portainer.yaml --profile data config --format json | jq -e '.services
              | .adminapi.environment.Oidc__Authority == "" and .adminapi.environment.Setup__Reopen == ""
                and .bootstrap.environment.FORS_GATEWAY_HOST == "llm.example.se"' >/dev/null
      - name: Setup mode in the deploy forms
        # The Portainer bootstrap (run as the stack runs it) and init-deployment.sh: the setup secret once, a client secret
        # only with the authority, a declared sign-in and FORS_SETUP_REOPEN kept on a re-run (deploy/tests/setup-mode-deploy.sh).
        run: bash deploy/tests/setup-mode-deploy.sh
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.403
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'global.json') }}
          restore-keys: nuget-
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            src/admin-ui/package-lock.json
            tests/e2e/package-lock.json
      - name: Build and test backend
        env:
          # Testcontainers pulls Postgres, Redis and its Ryuk image from Docker Hub, whose anonymous pull limit is shared by
          # every job on the runner's address and has failed whole test runs; Google's mirror of Docker Hub is not subject to it.
          TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: mirror.gcr.io/
        run: |
          dotnet build Fors.slnx -c Release --nologo
          # Tests marked [Trait(TestCategory.Name, TestCategory.Flaky)] (timing or race dependent) run locally and in the
          # weekly flake hunt, not here: a known flake should not fail a pull request (docs/local-development.md).
          dotnet test --solution Fors.slnx -c Release --no-build --filter-not-trait "Category=Flaky"
          dotnet list Fors.slnx package --vulnerable --include-transitive --format json > /tmp/fors-package-audit.json
          python -c "import json; d=json.load(open('/tmp/fors-package-audit.json')); p=[p for x in d.get('projects',[]) for f in x.get('frameworks',[]) for k in ('topLevelPackages','transitivePackages') for p in f.get(k,[]) if p.get('vulnerabilities')]; assert not p, 'Vulnerable .NET dependencies detected'"
      - name: Scan the service base image
        # The pinned runtime image (Directory.Build.targets) is shared by every service; fail on fixable HIGH/CRITICAL so a
        # stale digest does not ship known runtime CVEs. Every run scans it, which also catches CVEs published since it was
        # pinned; the weekly flake hunt scans it too.
        run: |
          image="$(dotnet msbuild src/Fors.Gateway -getProperty:ContainerBaseImage)"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.67.2 image --quiet --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$image"
      - name: Verify UI
        working-directory: src/admin-ui
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build
          npm audit --audit-level=low
      - name: Audit browser dependencies
        working-directory: tests/e2e
        run: |
          npm ci
          npx tsc --noEmit
          npm audit --audit-level=low
      - name: Publish and generate SPDX SBOM
        # Only the release uses it (release.yml attaches it to the GitHub release).
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          dotnet publish src/Fors.AdminApi -c Release -o /tmp/fors-release /p:PublishAdminUi=true
          dnx Microsoft.Sbom.DotNetTool@4.1.13 -y -- generate -b /tmp/fors-release -bc src -pn Fors -pv "$(dotnet msbuild src/Fors.AdminApi -getProperty:Version)" -ps "Umea kommun" -nsb https://www.umea.se/llm-gateway -V Warning
      - name: Upload release SBOM only
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: fors-gateway-spdx
          path: /tmp/fors-release/_manifest
